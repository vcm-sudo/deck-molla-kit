/* ============================================================
   CONTROLE REMOTO — o celular do apresentador passa a lâmina e
   aponta. O deck faz polling de /api/ctrl.
   Ritmo adaptativo: 1,2 s parado; 140 ms enquanto há atividade,
   para o ponteiro não engasgar sem encher o servidor de pedidos.
   O ponteiro interpola entre os pontos recebidos: o atraso da rede
   vira um rastro suave em vez de saltos.
   ============================================================ */
(function(){
  /* Dois caminhos, na ordem de latencia:
     1. LOCAL — /ctrl do proprio servidor da aula (Abrir aula.command). Mesma rede,
        resposta em milissegundos. E o caminho bom.
     2. NUVEM — /api/ctrl do app da segunda tela. Serve quando a rede do evento
        isola os aparelhos, ao preco de ~0,4 s por comando.
     O deck escuta os DOIS ao mesmo tempo. */
  const LOCAL = /^https?:/.test(location.protocol) && !/vercel\.app$/.test(location.hostname);
  if(!LOCAL && !POLL_ON) return;
  const el = document.getElementById('ptr');
  let ultimaAtividade = 0;
  let alvo = null, atualPos = null, raf = null;

  function posicionar(){
    if(!alvo){ raf = null; return; }
    const st = document.querySelector('#deck .slide.active .stage') || document.body;
    const r = st.getBoundingClientRect();
    if(!atualPos) atualPos = {x: alvo.x, y: alvo.y};
    atualPos.x += (alvo.x - atualPos.x) * 0.45;      // suavização (0,28 atrasava o halo ~100 ms)
    atualPos.y += (alvo.y - atualPos.y) * 0.45;
    el.style.transform = 'translate(' + (r.left + atualPos.x * r.width) + 'px,'
                                      + (r.top  + atualPos.y * r.height) + 'px)';
    raf = requestAnimationFrame(posicionar);
  }

  /* Os DOIS caminhos rodam ao mesmo tempo, cada um com o seu contador de comandos:
     o celular pode estar no controle.html (rede local) ou no presenter.html (nuvem), e
     o deck obedece aos dois. Antes, servido pelo Abrir aula.command, ele so lia o local
     e ignorava a nuvem — o presenter.html nao passava lamina nem apontava. */
  const seqs = {local: null, nuvem: null}, ptrs = {local: null, nuvem: null};
  function aplicar(c, src){
    /* respostas podem chegar fora de ordem (pedidos sobrepostos): um ponto mais antigo
       que o ultimo aplicado e descartado */
    ptrs[src] = (c.ptr && c.ptr.on) ? {x: +c.ptr.x || 0, y: +c.ptr.y || 0, ts: +c.ts || Date.now()} : null;
    const p = (ptrs.local && ptrs.nuvem) ? (ptrs.local.ts >= ptrs.nuvem.ts ? ptrs.local : ptrs.nuvem)
                                         : (ptrs.local || ptrs.nuvem);
    if(p){
      alvo = {x: p.x, y: p.y};
      el.classList.add('on');
      if(!raf) raf = requestAnimationFrame(posicionar);
      ultimaAtividade = Date.now();
    } else {
      el.classList.remove('on'); alvo = null; atualPos = null;
      if(raf){ cancelAnimationFrame(raf); raf = null; }
    }
    if(typeof c.seq === 'number'){
      const u = seqs[src];
      if(u === null){ seqs[src] = c.seq; return; }       // ao abrir, não reexecuta o último
      /* servidor reiniciou: o seq volta a zero; comparando so por ">" o deck ignorava
         todo comando dali em diante. Seq menor = servidor novo: ressincroniza. */
      if(c.seq < u){ seqs[src] = c.seq; return; }
      if(c.seq > u){
        seqs[src] = c.seq; ultimaAtividade = Date.now();
        const v = vis();
        if(c.cmd === 'next') next();
        else if(c.cmd === 'prev') prev();
        else if(c.cmd === 'first') show(0);
        else if(c.cmd === 'last') show(v.length - 1);
        else if(c.cmd === 'goto') show(Math.max(0, Math.min(v.length - 1, (c.n || 1) - 1)));
        /* teclas que o apresentador usa e que ficam longe quando o notebook esta na mesa */
        else if(c.cmd === 'revelar') dispatchEvent(new KeyboardEvent('keydown', {key: 'r'}));
        else if(c.cmd === 'zerar' && typeof zerarSessao === 'function') zerarSessao(true);
        else if(c.cmd === 'perguntas' && typeof irParaPerguntas === 'function') irParaPerguntas();
        hideHint();
      }
    }
  }

  const avisou = {local: false, nuvem: false}, emVoo = {local: 0, nuvem: 0};
  const pedidoN = {local: 0, nuvem: 0}, aplicadoN = {local: 0, nuvem: 0};   // ordem dos pedidos: resposta atrasada e descartada
  async function poll(src){
    const url = src === 'local' ? '/ctrl'
                                : POLL_BASE + '/api/ctrl?session=' + encodeURIComponent(POLL_SESSION);
    /* aba escondida: a nuvem nao e consultada (cada pedido conta na cota da Vercel) */
    if(src === 'nuvem' && document.hidden){ setTimeout(() => poll(src), 3000); return; }
    const rapido = (Date.now() - ultimaAtividade) < 8000;
    /* na nuvem cada pedido leva ~250 ms: enquanto o ponteiro anda, dispara o proximo
       ANTES de a resposta chegar (ate 3 em voo), senao o halo anda em degraus. As
       respostas fora de ordem sao filtradas pelo ts em aplicar(). */
    const sobrepor = src === 'nuvem' && rapido;
    if(sobrepor) setTimeout(() => poll(src), 70);
    if(emVoo[src] >= 3){ return; }
    emVoo[src]++;
    const meu = ++pedidoN[src];
    let ok = false;
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(r.ok){ const c = await r.json(); ok = true;
        if(meu > aplicadoN[src]){ aplicadoN[src] = meu; aplicar(c, src); }
        if(!avisou[src]){ avisou[src] = true; console.log('controle remoto: ' + (src === 'local' ? 'rede local' : 'nuvem')); } }
    }catch(_){}
    emVoo[src]--;
    if(sobrepor) return;
    /* local: pedido barato, consulta rapido e o ponteiro fica colado no dedo; se o
       servidor sumiu, reprova a cada 3 s. Nuvem parada: 1,2 s. */
    /* nuvem parada: 1,5 s — 400 ms gastava ~9 mil pedidos/hora por aba aberta e estourou a
       cota gratuita da Vercel (set-2026). O modo rapido so liga com atividade. */
    const espera = src === 'local' ? (ok ? (rapido ? 45 : 220) : 3000) : ((Date.now() - ultimaAtividade) < 8000 ? 70 : 1500);
    setTimeout(() => poll(src), espera);
  }
  if(LOCAL) poll('local');
  if(POLL_ON) poll('nuvem');   /* file:// = script de QA/render, nao aula ao vivo: nunca consultar a nuvem (set-2026, estourou a cota do Redis) */
})();

/* ---- A TELA NAO APAGA NO MEIO DA AULA ---------------------------------
   O Mac bloqueou duas vezes durante uma apresentacao (17-set-2026): numa aula
   o palestrante fica minutos sem tocar no teclado e o sistema entende como
   ocioso. A Screen Wake Lock segura o display enquanto esta aba esta visivel;
   o lock cai sozinho ao trocar de aba ou minimizar, entao e repedido quando a
   aba volta. Exige https ou localhost — por isso a aula tem de ser servida
   pelo servidor local, nunca aberta por file://. */
(function(){
  if(!('wakeLock' in navigator)) return;
  let lock = null, pedindo = false;
  async function pedir(){
    if(lock || pedindo || document.visibilityState !== 'visible') return;
    pedindo = true;
    try{
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    }catch(e){ /* bateria fraca ou politica do navegador: segue sem */ }
    pedindo = false;
  }
  pedir();
  document.addEventListener('visibilitychange', pedir);
  window.addEventListener('focus', pedir);
  /* alguns navegadores so concedem apos um gesto: a primeira tecla serve */
  window.addEventListener('keydown', pedir);
  window.addEventListener('pointerdown', pedir);
})();


/* ══════════════════════════════════════════════════════════════════════════
   MODO ANOTACAO (tecla A) — revisar a aula inteira numa sentada.
   Abre um campo na lamina atual, grava no servidor e segue. Sai daqui um
   REVISAO.md na pasta da aula, na ordem do deck, que e o que eu leio depois.
   Sem servidor (file://) o texto fica no navegador e o aviso diz isso.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  const LOCAL='revisao-local';
  let notas={}, prontas=false;

  const guardaLocal=()=>{ try{localStorage.setItem(LOCAL,JSON.stringify(notas));}catch(e){} };
  const leLocal=()=>{ try{return JSON.parse(localStorage.getItem(LOCAL)||'{}');}catch(e){return {};} };

  async function carregar(){
    if(prontas) return;
    prontas=true;
    notas=leLocal();
    try{
      const r=await fetch('/revisao',{cache:'no-store'});
      if(r.ok){ const d=await r.json(); if(d && typeof d==='object') notas=d; }
    }catch(e){}                       /* file:// ou servidor antigo: fica o local */
  }

  const cx=document.createElement('div');
  cx.id='anot';
  cx.innerHTML='<div class="cab"><b></b><i></i><button type="button" class="x" title="fechar">×</button></div><textarea rows="3" '+
    'placeholder="o que está errado nesta lâmina… ou segure espaço e fale"></textarea>'+
    '<div class="pe"><button type="button" class="mic">🎤 gravar áudio</button>'+
    '<span>enter ou → próxima · ← anterior · <b>segure espaço para ditar</b> · ⌘↩ ou esc fecha</span><em></em></div>';
  document.body.appendChild(cx);
  const cab=cx.querySelector('b'), num=cx.querySelector('i');
  const ta=cx.querySelector('textarea'), cont=cx.querySelector('em');
  const mic=cx.querySelector('.mic'), btX=cx.querySelector('.x');

  const atual=()=>document.querySelector('#deck .slide.active');
  let alvo=null;                 /* a lamina para a qual este campo foi aberto */
  const idDe=s=>s?(s.dataset.id||''):'';
  const nDe =s=>{ if(!s) return 0;
    const todos=[...document.querySelectorAll('#deck .slide')];
    const i=todos.indexOf(s);
    const k=vis().indexOf(i);
    return k>=0 ? k+1 : 0; };
  const tituloDe=s=>{ if(!s) return '';
    const h=s.querySelector('.topbar h1')||s.querySelector('h1')||s.querySelector('h2')
         ||s.querySelector('.kick')||s.querySelector('.cap');
    return h?h.textContent.trim().replace(/\s+/g,' ').slice(0,90):''; };

  function pinta(){
    const n=Object.keys(notas).length;
    const comAudio=Object.values(notas).filter(x=>x&&x.audio).length;
    cont.textContent = n ? (n+' lâmina'+(n>1?'s':'')+' anotada'+(n>1?'s':'')+
      (comAudio?' · '+comAudio+' com áudio':'')) : 'nenhuma anotação ainda';
    document.querySelectorAll('#org .mini').forEach(m=>{
      const id=m.dataset.id; if(id) m.classList.toggle('temnota', !!notas[id]);
    });
  }

  async function grava(){
    if(!alvo) return;
    const {id,n,titulo}=alvo, nota=ta.value.trim();
    const audio=(notas[id]||{}).audio;      /* so texto vazio E sem audio e que apaga */
    if(nota || audio) notas[id]=Object.assign({},notas[id]||{},{n:n,titulo:titulo,nota:nota});
    else delete notas[id];
    guardaLocal(); pinta();
    try{
      const r=await fetch('/revisao',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:id,n:n,titulo:titulo,nota:nota})});
      if(!r.ok) cont.textContent = r.status===404
        ? 'servidor antigo — feche o Terminal e reabra a aula'
        : 'o servidor recusou ('+r.status+') — guardado só no navegador';
    }catch(e){
      cont.textContent = location.protocol==='file:'
        ? 'sem servidor: guardado só no navegador (abra pelo “Abrir aula.command”)'
        : 'o servidor não respondeu — guardado só no navegador';
    }
  }


  /* ── ditar em vez de digitar. O audio vai inteiro para o servidor e eu
     transcrevo depois com o mlx_whisper, que ja e o padrao das orientacoes. */
  let rec=null, pedacos=[], t0=0, relogio=null, alvoAudio=null;
  let querGravar=false;       /* soltar o espaco antes de o mic abrir cancela */
  const gravando=()=>rec && rec.state==='recording';

  function pintaMic(){
    if(gravando()){
      const s=Math.floor((Date.now()-t0)/1000);
      mic.textContent='■ parar ('+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+')';
      mic.classList.add('rec');
    } else {
      mic.textContent='🎤 gravar áudio';
      mic.classList.remove('rec');
    }
  }

  async function iniciaGrav(){
    if(!navigator.mediaDevices || !window.MediaRecorder){
      cont.textContent='este navegador não grava áudio'; return;
    }
    if(!alvo || gravando()) return;
    querGravar=true;
    alvoAudio={...alvo};                       /* o audio e DESTA lamina, nao da atual */
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true});
      pedacos=[];
      rec=new MediaRecorder(st);
      rec.ondataavailable=e=>{ if(e.data && e.data.size) pedacos.push(e.data); };
      rec.onstop=async()=>{
        st.getTracks().forEach(x=>x.stop());
        clearInterval(relogio); relogio=null;
        pintaMic();
        const blob=new Blob(pedacos,{type:'audio/webm'});
        if(!blob.size || !alvoAudio) return;
        cont.textContent='enviando áudio…';
        try{
          const q='?id='+encodeURIComponent(alvoAudio.id)+'&n='+alvoAudio.n+
                  '&titulo='+encodeURIComponent(alvoAudio.titulo||'');
          const r=await fetch('/revisao-audio'+q,{method:'POST',
            headers:{'Content-Type':'application/octet-stream'},body:blob});
          if(r.ok){
            const d=await r.json();
            notas[alvoAudio.id]=Object.assign({},notas[alvoAudio.id]||{},
              {n:alvoAudio.n,titulo:alvoAudio.titulo,audio:d.arquivo,
               nota:(notas[alvoAudio.id]&&notas[alvoAudio.id].nota)||ta.value.trim()});
            guardaLocal(); pinta();
            cont.textContent='áudio gravado · '+Math.round((d.bytes||0)/1024)+' KB';
            if(alvo && alvo.id===alvoAudio.id && ta.value.trim()) await grava();
          } else if(r.status===404){
            cont.textContent='servidor antigo — feche o Terminal e reabra a aula';
          } else {
            cont.textContent='o servidor recusou o áudio ('+r.status+')';
          }
        }catch(e){
          cont.textContent = location.protocol==='file:'
            ? 'abra pelo “Abrir aula.command” para gravar áudio'
            : 'o servidor não respondeu — o áudio não foi salvo';
        }
      };
      if(!querGravar){ st.getTracks().forEach(x=>x.stop()); rec=null; return; }
      rec.start();
      t0=Date.now(); relogio=setInterval(pintaMic,1000); pintaMic();
    }catch(e){ cont.textContent='sem permissão para o microfone'; }
  }

  function paraGrav(){ querGravar=false; if(gravando()) rec.stop(); else pintaMic(); }

  /* ── segurar ESPACO grava (push-to-talk), como no proprio Claude Code.
     O espaco e prevenido no keydown e reinserido no keyup se foi curto — senao
     nao daria para escrever espaco nenhum no texto. */
  const ESPERA=380;                    /* abaixo disto e digitacao, acima e ditado */
  /* O espaco entra NA HORA (no keydown, comportamento normal do campo). Antes ele
     so era inserido no keyup: quem digita rapido aperta a letra seguinte antes de
     soltar o espaco e o espaco caia depois dela ("dap ara"). Agora, se a tecla
     ficar segurada alem de ESPERA, o espaco recem-inserido e retirado e o ditado
     comeca. */
  let espTimer=null, espGravou=false, espPos=-1;
  ta.addEventListener('keydown',e=>{
    if(e.key!==' '||e.metaKey||e.ctrlKey||e.altKey) return;
    e.stopPropagation();
    if(e.repeat){ e.preventDefault(); return; }   /* segurando: nada de espacos em serie */
    espGravou=false;
    espPos=ta.selectionStart+1;                   /* onde o espaco vai terminar */
    clearTimeout(espTimer);
    espTimer=setTimeout(()=>{
      if(ta.value.charAt(espPos-1)===' '){        /* tira o espaco do ditado */
        const p=espPos-1;
        ta.value=ta.value.slice(0,p)+ta.value.slice(p+1);
        ta.selectionStart=ta.selectionEnd=p;
      }
      espGravou=true; iniciaGrav();
    },ESPERA);
  },true);
  ta.addEventListener('input',()=>{               /* digitou outra coisa: era espaco mesmo */
    if(espTimer && ta.selectionStart!==espPos){ clearTimeout(espTimer); espTimer=null; }
  });
  ta.addEventListener('keyup',e=>{
    if(e.key!==' ') return;
    e.stopPropagation();
    clearTimeout(espTimer); espTimer=null;
    if(espGravou){ paraGrav(); espGravou=false; }
  },true);

  mic.addEventListener('click',e=>{ e.preventDefault(); gravando()?paraGrav():iniciaGrav(); ta.focus(); });

  async function abrir(){
    await carregar();
    const s=atual(); if(!s) return;
    alvo={id:idDe(s), n:nDe(s), titulo:tituloDe(s)};
    cab.textContent=alvo.titulo||alvo.id;
    num.textContent=alvo.n+' · '+alvo.id;
    ta.value=(notas[alvo.id]&&notas[alvo.id].nota)||'';
    pintaMic();
    pinta();
    cx.classList.add('on');
    setTimeout(()=>{ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);},30);
  }
  function fechar(){ cx.classList.remove('on'); ta.blur(); alvo=null; }
  const aberto=()=>cx.classList.contains('on');

  /* anda entre LAMINAS (next() revelaria antes os data-passo). Com o campo
     aberto quem reabre e o observer, senao o campo piscava duas vezes. */
  function irPara(passo){
    const s=atual(); if(!s || typeof show!=='function') return false;
    const todos=[...document.querySelectorAll('#deck .slide')];
    const v=vis(), k=v.indexOf(todos.indexOf(s)), d=k+passo;
    if(k<0 || d<0 || d>=v.length) return false;   /* nas pontas, fica */
    const reabrir=!aberto();
    show(v[d]);
    if(reabrir) setTimeout(abrir,160);
    return true;
  }
  const proxima=()=>irPara(1);

  ta.addEventListener('keydown',async e=>{
    e.stopPropagation();
    if(e.key==='Escape'){ paraGrav(); grava().then(fechar); return; }
    /* cmd/ctrl+enter grava e fecha SEM ir para a proxima; cmd/ctrl+. tambem
       fecha. Servem onde o Esc nao chega — em tela cheia ele e do navegador. */
    if((e.metaKey||e.ctrlKey) && (e.key==='Enter'||e.key==='.')){
      e.preventDefault();
      if(gravando()) paraGrav();
      await grava(); fechar(); return;
    }
    /* o textarea engolia as setas e so dava para avancar clicando. Agora elas
       andam quando o cursor esta na ponta do texto (ou o campo vazio), e com
       cmd/alt sempre — o texto em edicao e gravado antes de sair. */
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      const d = e.key==='ArrowRight' ? 1 : -1;
      const ponta = ta.value==='' ||
        (ta.selectionStart===ta.selectionEnd &&
         (d<0 ? ta.selectionStart===0 : ta.selectionStart===ta.value.length));
      if(e.metaKey || e.altKey || ponta){
        e.preventDefault();
        if(gravando()){ paraGrav(); return; }
        await grava();
        irPara(d);
        return;
      }
    }
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      if(gravando()){ paraGrav(); return; }   /* 1o enter so encerra o audio */
      await grava();
      fechar();
      proxima();
    }
  });

  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey) && (e.key==='Enter'||e.key==='.')){
      if(aberto()) return;                     /* aberto: quem trata e o textarea */
      e.preventDefault(); abrir(); return;
    }
    if(aberto()) return;                       /* o textarea cuida das proprias teclas */
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const alvo=e.target;
    if(alvo && alvo.closest && alvo.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')) return;
    if(window.__irAberto) return;
    if(e.key==='a'||e.key==='A'){ e.preventDefault(); abrir(); }
  },true);                                     /* captura: chega antes do handler geral */


  /* ══ a lamina trocou com o campo aberto ══
     Antes o campo continuava mostrando a lamina anterior e o que fosse escrito
     ia para ELA — em silencio. Agora o texto pendente e gravado na lamina certa
     e o campo se muda para a nova. */
  let ultimaAtiva=null;
  async function sincroniza(){
    if(!aberto()) return;
    const s=atual(); if(!s) return;
    const id=idDe(s);
    if(alvo && id && id!==alvo.id){
      if(gravando()) paraGrav();     /* o audio pertence a lamina onde comecou */
      await grava();                 /* grava no alvo ANTIGO, que ainda esta em alvo */
      abrir();                       /* reabre ja na lamina nova */
    }
  }
  new MutationObserver(()=>{
    const s=atual(); const id=idDe(s);
    if(id!==ultimaAtiva){ ultimaAtiva=id; sincroniza(); }
  }).observe(document.getElementById('deck')||document.body,
             {subtree:true, attributes:true, attributeFilter:['class']});

  /* ══ o Esc em tela cheia e do navegador: ele sai do fullscreen e nunca chega
     aqui. Entao fechamos pelo efeito — ao sair da tela cheia, o campo fecha
     gravando o que estava escrito. */
  document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement && aberto()){
      if(gravando()) paraGrav();
      grava().then(fechar);
    }
  });

  btX.addEventListener('click',e=>{ e.preventDefault(); if(gravando())paraGrav(); grava().then(fechar); });

  carregar().then(pinta);
  window.anotAbrir=abrir;
})();
</script>
